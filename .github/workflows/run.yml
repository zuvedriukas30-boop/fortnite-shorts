name: Fortnite Shorts

# Paleidžia Cloudflare Worker: „daily" — kasdienis 07:00 signalas,
# „dar" — kai Telegrame parašai /dar.
on:
  repository_dispatch:
    types: [daily, dar]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fortnite-shorts
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ieškom ir siunčiam į Telegram
        run: npm run find:ci
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Įrašom seen.json atgal į repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: atnaujintas seen.json (${{ github.event.action || 'rankinis' }})"
          git pull --rebase --autostash
          git push
