name = "fortnite-shorts"
main = "index.js"
compatibility_date = "2026-01-01"

# 04:00 UTC = 07:00 Vilniuje vasarą, 05:00 UTC = 07:00 žiemą.
# Worker pats patikrina vietinę valandą ir dirba tik tinkamu metu.
[triggers]
crons = ["0 4 * * *", "0 5 * * *"]

[vars]
GITHUB_REPO = "zuvedriukas30-boop/fortnite-shorts"

# Slapti kintamieji (nustatomi per `wrangler secret put`, į repo nepatenka):
#   GITHUB_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, WEBHOOK_SECRET
